<!DOCTYPE html>
<html lang="fr" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mes Projets - Eliot SAURON</title>
  <link rel="stylesheet" href="assets/css/style.css">
</head>
<body>
  <div class="noise-overlay"></div>
  <div class="ambient-bg"><div class="blob b1"></div><div class="blob b2"></div></div>
  <button class="theme-toggle" id="themeBtn">🌙</button>

  <header class="site-header">
    <a href="index.html" class="logo-container">
      <svg class="logo-svg" viewBox="0 0 200 80" fill="none">
        <defs>
            <linearGradient id="cloud-gradient" x1="0%" y1="0%" x2="100%" y2="0%">
                <stop offset="0%" style="stop-color:var(--peach);stop-opacity:0.8" />
                <stop offset="100%" style="stop-color:var(--blue);stop-opacity:0.9" />
            </linearGradient>
        </defs>
        <text x="50%" y="50%" dominant-baseline="middle" text-anchor="middle" class="logo-text-elem">Eliot</text>
        <path class="cloud-path" d="M20,40 C20,20 50,-10 100,10 C150,30 180,20 180,40 C180,60 150,90 100,70 C50,50 20,60 20,40" stroke="url(#cloud-gradient)" stroke-width="5" fill="none" stroke-linecap="round" />
      </svg>
    </a>
  </header>

  <nav class="dock-nav">
    <a href="index.html" class="dock-link">Accueil</a>
    <a href="creations.html" class="dock-link active">Projets</a>
    <a href="cv.html" class="dock-link">Parcours</a>
    <a href="mailto:eliotsauron25@gmail.com" class="dock-link">Contact</a>
  </nav>

  <main data-barba="wrapper">
    <div class="page-view" data-barba="container" data-namespace="creations">
      
      <div style="text-align: center; margin-bottom: 50px;">
        <h1>Mes Projets</h1>
        <div class="filters">
          <button class="filter-btn active" data-filter="all">Tout</button>
          <button class="filter-btn" data-filter="design">Design</button>
          <button class="filter-btn" data-filter="media">Vidéo</button>
          <button class="filter-btn" data-filter="photo">Photo</button>
        </div>
      </div>

      <div class="grid">
        <div class="card" data-category="design">
          <img src="img/ajna-cover.jpg" class="card-img" alt="Projet" onerror="this.src='https://via.placeholder.com/400x500'">
          <span class="badge">Direction Artistique</span>
          <h3>AJNA - Rivages Invisibles</h3>
          <p>Identité visuelle, logo et storytelling.</p>
        </div>

        <div class="card" data-category="media">
          <img src="img/radio-1.jpg" class="card-img" alt="Radio" onerror="this.src='https://via.placeholder.com/400x500'">
          <span class="badge">Vidéo & Comm</span>
          <h3>Radio Campus</h3>
          <p>Réalisation de reels et contenu réseaux.</p>
        </div>

         <div class="card" data-category="photo">
          <img src="img/rv-cover.jpg" class="card-img" alt="Livre" onerror="this.src='https://via.placeholder.com/400x500'">
          <span class="badge">Édition</span>
          <h3>Rendez-moi en ville</h3>
          <p>Projet d'édition poétique urbain.</p>
        </div>
      </div>

    </div>
  </main>

  <script src="https://unpkg.com/@barba/core"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
  <script src="https://cdn.jsdelivr.net/gh/studio-freight/lenis@1.0.29/bundled/lenis.min.js"></script>
  <script src="assets/js/main.js"></script>
</body>
</html>
