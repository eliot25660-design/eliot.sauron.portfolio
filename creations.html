<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <title>Projets – Eliot SAURON</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500&family=Syne:wght@700;800&display=swap" rel="stylesheet">

  <style>
    :root { --bg: #030303; --text: #F0F0F0; --accent: #FFBEAC; --line: rgba(255, 255, 255, 0.08); }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    
    body {
      background: var(--bg); color: var(--text); font-family: 'Outfit';
      opacity: 0; transition: opacity 0.5s ease;
    }
    body.loaded { opacity: 1; }

    /* LOADER COMPACT */
    #loader { position: fixed; inset: 0; background: #000; z-index: 9999; transition: transform 0.6s ease-in-out; }
    body.loaded #loader { transform: translateY(-100%); }

    /* LAYOUT */
    nav { padding: 25px 40px; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid var(--line); }
    .logo svg { height: 30px; }
    .back-link { color: var(--text); text-decoration: none; font-size: 13px; font-weight: 700; text-transform: uppercase; letter-spacing: 1px; opacity: 0.7; }
    
    .header-projets { padding: 120px 20px 60px; text-align: center; }
    h1 { font-family: 'Syne'; font-size: clamp(50px, 8vw, 100px); text-transform: uppercase; font-weight: 800; margin-bottom: 40px; }
    
    .filters { display: flex; gap: 15px; justify-content: center; flex-wrap: wrap; }
    .f-btn {
      background: transparent; border: 1px solid var(--line); color: #888;
      padding: 10px 25px; border-radius: 50px; cursor: pointer; text-transform: uppercase;
      font-size: 12px; font-weight: 700; letter-spacing: 1px; transition: 0.3s;
    }
    .f-btn:hover, .f-btn.active { background: var(--text); color: #000; border-color: var(--text); }

    .grid {
      display: grid; grid-template-columns: repeat(auto-fill, minmax(380px, 1fr));
      gap: 40px; padding: 0 40px 100px; max-width: 1400px; margin: 0 auto;
    }
    
    .card {
      group; cursor: pointer; position: relative;
    }
    .img-box {
      width: 100%; aspect-ratio: 4/3; overflow: hidden; border-radius: 8px;
      margin-bottom: 20px; border: 1px solid var(--line); transition: border-color 0.3s;
    }
    .img-box img { width: 100%; height: 100%; object-fit: cover; transition: transform 0.7s cubic-bezier(0.2, 1, 0.3, 1); opacity: 0.8; }
    
    .card:hover .img-box { border-color: var(--accent); }
    .card:hover .img-box img { transform: scale(1.05); opacity: 1; }

    .meta { display: flex; justify-content: space-between; align-items: baseline; border-top: 1px solid var(--line); padding-top: 15px; }
    h3 { font-family: 'Syne'; font-size: 20px; font-weight: 700; }
    .cat { font-size: 11px; text-transform: uppercase; color: var(--accent); letter-spacing: 1px; font-weight: 700; }

    /* LIGHTBOX */
    .lightbox {
      position: fixed; inset: 0; background: rgba(0,0,0,0.95); z-index: 5000;
      display: flex; align-items: center; justify-content: center; opacity: 0; pointer-events: none; transition: 0.3s;
    }
    .lightbox.active { opacity: 1; pointer-events: auto; }
    .lb-img { max-width: 90%; max-height: 85vh; object-fit: contain; }
    .close { position: absolute; top: 30px; right: 30px; font-size: 40px; color: #FFF; cursor: pointer; }

    footer { border-top: 1px solid var(--line); padding: 40px; text-align: center; color: #555; font-size: 12px; }

    @media (max-width: 768px) { .grid { grid-template-columns: 1fr; padding: 0 20px 50px; } }
  </style>
</head>
<body>
  <div id="loader"></div>

  <nav>
    <a href="index.html" class="logo">
      <svg viewBox="0 0 120 40" fill="none" xmlns="http://www.w3.org/2000/svg">
        <text x="0" y="30" font-family="Syne" font-weight="800" font-size="24" fill="#FFF">ELIOT.</text>
      </svg>
    </a>
    <a href="index.html" class="back-link">Retour</a>
  </nav>

  <div class="header-projets">
    <h1>Travaux</h1>
    <div class="filters">
      <button class="f-btn active" data-filter="all">Tous</button>
      <button class="f-btn" data-filter="design">Design</button>
      <button class="f-btn" data-filter="media">Vidéo</button>
      <button class="f-btn" data-filter="photo">Photo</button>
    </div>
  </div>

  <div class="grid">
    <div class="card" data-cat="design" onclick="openLb('img/ajna-cover.jpg')">
      <div class="img-box"><img src="img/ajna-cover.jpg"></div>
      <div class="meta"><h3>AJNA</h3><span class="cat">Art Direction</span></div>
    </div>
    
    <div class="card" data-cat="media" onclick="openLb('img/radio-1.jpg')">
      <div class="img-box"><img src="img/radio-1.jpg"></div>
      <div class="meta"><h3>Radio Campus</h3><span class="cat">Social Media</span></div>
    </div>

    <div class="card" data-cat="photo" onclick="window.open('img/rendez-moi-en-ville.pdf')">
      <div class="img-box"><img src="img/rv-cover.jpg"></div>
      <div class="meta"><h3>Rendez-moi en ville</h3><span class="cat">Édition (PDF)</span></div>
    </div>

    <div class="card" data-cat="photo" onclick="openLb('img/photo-nb-1.jpg')">
      <div class="img-box"><img src="img/photo-nb-1.jpg"></div>
      <div class="meta"><h3>Noir & Blanc</h3><span class="cat">Photographie</span></div>
    </div>
  </div>

  <div class="lightbox" id="lb">
    <div class="close" onclick="closeLb()">×</div>
    <img src="" class="lb-img" id="lb-img">
  </div>

  <footer>© 2025 Eliot Sauron • <a href="mentions-legales.html" style="color:#777;text-decoration:none">Mentions</a></footer>

  <script>
    window.onload = () => document.body.classList.add('loaded');

    // FILTRES
    const btns = document.querySelectorAll('.f-btn');
    const cards = document.querySelectorAll('.card');
    btns.forEach(btn => {
      btn.addEventListener('click', () => {
        btns.forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        const f = btn.dataset.filter;
        cards.forEach(c => c.style.display = (f==='all' || c.dataset.cat===f) ? 'block' : 'none');
      });
    });

    // LIGHTBOX
    const lb = document.getElementById('lb');
    const lbImg = document.getElementById('lb-img');
    window.openLb = (src) => { lbImg.src = src; lb.classList.add('active'); };
    window.closeLb = () => lb.classList.remove('active');
  </script>
</body>
</html>
